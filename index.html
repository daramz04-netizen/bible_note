<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>성경 한줄정리</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
:root{--bg:#f2f4f0;--surface:#fff;--ink:#1d2823;--sub:#66726c;--line:#dce1da;--accent:#2d4a3e;--accent-ink:#fff;--hl:#ffe55c;--hl-soft:#fff6bd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--surface:#1d2521;--ink:#eaf0ec;--sub:#97a49d;--line:#2d3833;--accent:#8fc4ab;--accent-ink:#10201a;--hl:#d9bf2a;--hl-soft:#3a3612;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a17;--surface:#1d2521;--ink:#eaf0ec;--sub:#97a49d;--line:#2d3833;--accent:#8fc4ab;--accent-ink:#10201a;--hl:#d9bf2a;--hl-soft:#3a3612;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 80px}
header{padding:22px 0 10px;position:relative}
.gear{width:32px;height:32px;border:0;background:transparent;color:var(--sub);font-size:19px;line-height:1;cursor:pointer;border-radius:8px}
.gear:hover{background:var(--line)}
.cd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.cd.fav{border-color:var(--hl)}
.cd .ct{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;cursor:pointer}
.cd .t{font-family:"Noto Serif KR",Georgia,serif;font-weight:700;font-size:16px;padding:0 2px}
.cd.fav .t{background:linear-gradient(transparent 45%,var(--hl) 45%,var(--hl) 92%,transparent 92%)}
.cd .dd{font-size:12px;color:var(--sub)}
.cd .star{font-size:12px;color:var(--sub);margin-left:auto}
.cd .cs{margin:6px 0 0;font-weight:500;font-size:15px;word-break:keep-all}
.cd .cm{margin:6px 0 0;font-size:14px;color:var(--sub);white-space:pre-wrap}
.cd .no{color:var(--sub);font-size:13px;margin:6px 0 0}
.colbar{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.pdfbtn{border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
.modal.on{display:flex}
.box{background:var(--surface);border-radius:14px;padding:20px;max-width:340px;width:100%}
.box h3{margin:0 0 12px;font-family:"Noto Serif KR",Georgia,serif;font-size:17px}
.box p{font-size:14px;color:var(--sub);margin:0 0 14px}
.btn{display:block;width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-top:8px;cursor:pointer}
.btn.red{color:#c0392b;border-color:#c0392b}
.btn.danger{background:#c0392b;border-color:#c0392b;color:#fff}
.btns{display:flex;gap:8px}.btns .btn{margin-top:0}
h1{font-family:"Noto Serif KR",Georgia,serif;font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--sub);font-size:14px;margin:0}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:14px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tabs{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0;z-index:5}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font:inherit;font-weight:500;cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
h2{font-family:"Noto Serif KR",Georgia,serif;font-size:18px;margin:22px 0 10px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.book{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 8px;text-align:left;font:inherit;cursor:pointer;position:relative;overflow:hidden}
.book b{display:block;font-size:14px;font-weight:700}
.book span{font-size:12px;color:var(--sub)}
.book i{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.book.done{border-color:var(--accent)}
.back{border:0;background:none;color:var(--accent);font:inherit;font-weight:500;padding:8px 0;cursor:pointer}
.bhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:4px 0 8px}
.bhead h2{margin:0}
.hint{font-size:12.5px;color:var(--sub);margin:0 0 10px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:96px 1fr;gap:8px 12px;align-items:start}
.row.fav{border-color:var(--hl)}
.ch{grid-row:span 2;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;cursor:pointer}
.ch .t{font-family:"Noto Serif KR",Georgia,serif;font-weight:700;font-size:17px;display:inline;padding:0 2px}
.fav .ch .t{background:linear-gradient(transparent 45%,var(--hl) 45%,var(--hl) 92%,transparent 92%)}
.ch .star{font-size:12px;color:var(--sub);display:block;margin-top:4px;min-height:18px}
.ch.press .t{opacity:.5}
.read{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--sub)}
.read input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.read input[type=date]{font:inherit;font-size:12px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:1px 4px;max-width:128px;display:none}
.read.on input[type=date]{display:block}
.row input[type=text],.row textarea{width:100%;font:inherit;font-size:14.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.row textarea{min-height:44px}
.row input:focus,.row textarea:focus{outline:2px solid var(--accent);outline-offset:0}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;margin-bottom:14px}
.cb{height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font:inherit;font-weight:500;cursor:pointer;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.cb.fav{background:var(--hl);border-color:var(--hl);font-weight:700;color:#1d2823}
.cb.rd::after{content:"";position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.cb.sel{outline:2px solid var(--accent);outline-offset:1px}
.cb.press{opacity:.55}
.gh{font-family:"Noto Serif KR",Georgia,serif;font-size:15px;color:var(--sub);margin:18px 0 8px}
.empty{padding:40px 12px;text-align:center;color:var(--sub);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}
@media (max-width:520px){.row{grid-template-columns:1fr}.ch{grid-row:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.ch .star{margin:0}.read{margin:0 0 0 auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.top{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:8px}
.uem{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lo{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.authwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.authwrap[hidden]{display:none}
.acard{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 22px}
.acard input{width:100%;font:inherit;padding:11px 12px;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.acard input:focus{outline:2px solid var(--accent)}
.abtn{width:100%;margin-top:12px;padding:12px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;border:1px solid var(--accent)}
.abtn.pri{background:var(--accent);color:var(--accent-ink)}
.abtn.sec{background:transparent;color:var(--accent);margin-top:8px}
.abtn:disabled{opacity:.5}
.amsg{min-height:20px;font-size:13px;color:#c0392b;margin:10px 0 0}
.amsg.ok{color:var(--accent)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div class="wrap" id="app" hidden>
<header>
<div class="top"><span class="uem" id="uemail"></span><button class="lo" id="logout">로그아웃</button><button class="gear" id="gear" aria-label="설정">⚙︎</button></div>
<h1>성경 한줄정리</h1>
<p class="sub" id="total"></p>
<div class="bar"><i id="totalbar"></i></div>
</header>
<div class="tabs"><button id="tAll" class="on">전체 성경</button><button id="tCol">모아보기</button><button id="tFav">즐겨찾기 <span id="favN">0</span></button></div>
<main id="view"></main>
</div>
<div class="toast" id="toast"></div>
<div class="authwrap" id="auth"><form class="acard" id="aform" autocomplete="on">
<h1>성경 한줄정리</h1><p class="sub">이메일로 로그인하면 기록이 내 계정에 저장돼요.</p>
<input type="email" id="em" placeholder="이메일" autocomplete="email" required>
<input type="password" id="pw" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" required>
<p class="amsg" id="amsg"></p>
<button type="submit" class="abtn pri" id="btnIn">로그인</button>
<button type="button" class="abtn sec" id="btnUp">회원가입</button>
</form></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<script>
const OT="창세기 50,출애굽기 40,레위기 27,민수기 36,신명기 34,여호수아 24,사사기 21,룻기 4,사무엘상 31,사무엘하 24,열왕기상 22,열왕기하 25,역대상 29,역대하 36,에스라 10,느헤미야 13,에스더 10,욥기 42,시편 150,잠언 31,전도서 12,아가 8,이사야 66,예레미야 52,예레미야애가 5,에스겔 48,다니엘 12,호세아 14,요엘 3,아모스 9,오바댜 1,요나 4,미가 7,나훔 3,하박국 3,스바냐 3,학개 2,스가랴 14,말라기 4";
const NT="마태복음 28,마가복음 16,누가복음 24,요한복음 21,사도행전 28,로마서 16,고린도전서 16,고린도후서 13,갈라디아서 6,에베소서 6,빌립보서 4,골로새서 4,데살로니가전서 5,데살로니가후서 3,디모데전서 6,디모데후서 4,디도서 3,빌레몬서 1,히브리서 13,야고보서 5,베드로전서 5,베드로후서 3,요한일서 5,요한이서 1,요한삼서 1,유다서 1,요한계시록 22";
const parse=s=>s.split(",").map(x=>{const [n,c]=x.split(" ");return{n,c:+c}});
const BOOKS=[...parse(OT),...parse(NT)];
const OT_N=39, TOTAL=BOOKS.reduce((a,b)=>a+b.c,0);
const SUPABASE_URL="https://wyteceymdkywmeqexfjt.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_8aZI7Q5LnIsNHzx5c76NWQ_Uly2LEVn";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const TABLE="bible_notes";
/* 한 장 = 테이블 한 행. title="창세기 1장", content=JSON {s:한줄정리,m:묵상,d:읽은날짜,f:즐겨찾기} */
let D={},ROW={},USER=null,chan=null;
const timers={},dirty={},inflight={};
const TITLE2KEY={};BOOKS.forEach((bk,b)=>{for(let c=1;c<=bk.c;c++)TITLE2KEY[bk.n+" "+c+"장"]=b+"-"+c});
const keyTitle=k=>{const [b,c]=k.split("-");return BOOKS[b].n+" "+c+"장"};
const get=(b,c)=>D[b+"-"+c]||{};
function set(b,c,k,v){const id=b+"-"+c;const o=D[id]||(D[id]={});if(v===""||v===false||v==null)delete o[k];else o[k]=v;if(!Object.keys(o).length)delete D[id];queueSave(id)}
function queueSave(id){dirty[id]=1;clearTimeout(timers[id]);timers[id]=setTimeout(()=>{timers[id]=0;persist(id)},500)}
async function persist(id){
  if(!USER)return;
  const o=D[id];
  try{
    if(!o){
      if(ROW[id]){const rid=ROW[id];delete ROW[id];const {error}=await sb.from(TABLE).delete().eq("id",rid).eq("user_id",USER.id);if(error)throw error}
      return;
    }
    const content=JSON.stringify(o);
    if(ROW[id]){const {error}=await sb.from(TABLE).update({content}).eq("id",ROW[id]).eq("user_id",USER.id);if(error)throw error}
    else{
      if(inflight[id]){queueSave(id);return}
      inflight[id]=1;
      const {data,error}=await sb.from(TABLE).insert({user_id:USER.id,title:keyTitle(id),content}).select("id").single();
      delete inflight[id];if(error)throw error;
      ROW[id]=data.id;
      if(!D[id])persist(id);else if(JSON.stringify(D[id])!==content)queueSave(id);
    }
  }catch(e){delete inflight[id];toast("저장 실패: "+(e.message||"오류"))}
  finally{if(!timers[id])delete dirty[id]}
}
async function flush(){for(const id of Object.keys(dirty)){clearTimeout(timers[id]);timers[id]=0;await persist(id)}}
async function loadAll(){
  const rows=[];
  for(let from=0;;from+=1000){
    const {data,error}=await sb.from(TABLE).select("id,title,content,created_at").eq("user_id",USER.id).order("created_at",{ascending:true}).range(from,from+999);
    if(error){toast("불러오기 실패: "+error.message);return}
    rows.push(...data);if(data.length<1000)break;
  }
  D={};ROW={};const dups=[];
  for(const r of rows){const k=TITLE2KEY[r.title];if(!k)continue;let o;try{o=JSON.parse(r.content)}catch(e){continue}
    if(ROW[k])dups.push(ROW[k]);ROW[k]=r.id;D[k]=o}
  if(dups.length)sb.from(TABLE).delete().in("id",dups).eq("user_id",USER.id).then(()=>{});
}
/* 실시간 동기화 (다른 기기·탭에서 바꾼 내용 반영) */
function subscribe(){
  if(chan)sb.removeChannel(chan);
  chan=sb.channel("notes-"+USER.id).on("postgres_changes",{event:"*",schema:"public",table:TABLE,filter:"user_id=eq."+USER.id},onChange).subscribe();
}
function onChange(p){
  if(p.eventType==="DELETE"){
    const k=Object.keys(ROW).find(x=>ROW[x]===(p.old&&p.old.id));if(!k||dirty[k])return;
    delete ROW[k];delete D[k];
  }else{
    const r=p.new;if(!r)return;const k=TITLE2KEY[r.title];if(!k||dirty[k])return;
    let o;try{o=JSON.parse(r.content)}catch(e){return}
    ROW[k]=r.id;if(JSON.stringify(D[k]||null)===JSON.stringify(o))return;D[k]=o;
  }
  const a=document.activeElement;
  if(a&&a.closest&&a.closest("#view")&&/INPUT|TEXTAREA/.test(a.tagName))stats();else render();
}
const $=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1400)}
function bookRead(b){let n=0;for(let c=1;c<=BOOKS[b].c;c++)if(get(b,c).d)n++;return n}
function stats(){
  let r=0,f=0;for(const id in D){if(D[id].d)r++;if(D[id].f)f++}
  $("total").textContent=`전체 ${TOTAL}장 중 ${r}장 읽음 (${Math.round(r/TOTAL*100)}%)`;
  $("totalbar").style.width=(r/TOTAL*100)+"%";
  $("favN").textContent=f;
}
let tab="all",cur=null,sel=null;
function renderEd(){const e=$("ed");if(e)e.innerHTML=sel?rowHTML(cur,sel):'<div class="empty">장 번호를 눌러 한줄정리와 묵상을 작성하세요.</div>'}
function render(){
  stats();
  $("tAll").classList.toggle("on",tab==="all");$("tFav").classList.toggle("on",tab==="fav");$("tCol").classList.toggle("on",tab==="col");
  const v=$("view");
  if(tab==="col"){
    const items=[];BOOKS.forEach((bk,b)=>{for(let c=1;c<=bk.c;c++){const o=get(b,c);if(o.s||o.m||o.d||o.f)items.push([b,c])}});
    const head=`<div class="colbar"><span class="sub">기록된 ${items.length}개 장</span><button class="pdfbtn" id="pdf1">PDF로 저장</button></div>`;
    if(!items.length){v.innerHTML=head+'<div class="empty">아직 기록된 장이 없습니다.<br>전체 성경에서 장을 눌러 기록을 시작해 보세요.</div>';return}
    let h=head+'<p class="hint">기록이 있는 모든 장을 보기 전용으로 모았어요. 장 이름을 꾹 누르면 즐겨찾기가 바뀝니다.</p>',last=-1;
    items.forEach(([b,c])=>{if(b!==last){h+=`<div class="gh">${BOOKS[b].n}</div>`;last=b}h+=cardHTML(b,c)});
    v.innerHTML=h;return;
  }
  if(tab==="fav"){
    const items=[];BOOKS.forEach((bk,b)=>{for(let c=1;c<=bk.c;c++)if(get(b,c).f)items.push([b,c])});
    if(!items.length){v.innerHTML='<div class="empty">즐겨찾기한 장이 없습니다.<br>장 이름을 꾹 누르면 형광펜 표시와 함께 추가됩니다.</div>';return}
    let h='<p class="hint">보기 전용입니다. 장 이름을 꾹 누르면 즐겨찾기가 해제됩니다.</p>',last=-1;
    items.forEach(([b,c])=>{if(b!==last){h+=`<div class="gh">${BOOKS[b].n}</div>`;last=b}h+=cardHTML(b,c)});
    v.innerHTML=h;return;
  }
  if(cur===null){
    const sec=(title,from,to)=>{let h=`<h2>${title}</h2><div class="books">`;
      for(let b=from;b<to;b++){const n=bookRead(b),p=n/BOOKS[b].c*100;
        h+=`<button class="book ${n===BOOKS[b].c?"done":""}" data-b="${b}"><b>${BOOKS[b].n}</b><span>${n}/${BOOKS[b].c}장</span><i style="width:${p}%"></i></button>`}
      return h+"</div>"};
    v.innerHTML=sec("구약 39권",0,OT_N)+sec("신약 27권",OT_N,66);return;
  }
  const bk=BOOKS[cur];let h=`<button class="back" id="back">← 목록으로</button><div class="bhead"><h2>${bk.n}</h2><span class="sub" id="bcount">${bookRead(cur)}/${bk.c}장 읽음</span></div><p class="hint">장 번호를 꾹 누르면 형광펜 색으로 칠해지며 즐겨찾기가 됩니다. 파란 점은 읽은 장이에요.</p>`;
  h+='<div class="chgrid">';
  for(let c=1;c<=bk.c;c++){const o=get(cur,c);h+=`<button class="cb ${o.f?"fav":""} ${o.d?"rd":""} ${c===sel?"sel":""}" data-c="${c}">${c}</button>`}
  h+='</div><div id="ed"></div>';
  v.innerHTML=h;renderEd();
}

/* PDF export: pages are drawn on canvas (so Korean text always renders) and packed into a PDF */
let DL=null;
(async()=>{try{DL=await claude.use("downloads")}catch(e){}})();
const NL=String.fromCharCode(10);
function buildPDF(jpgs,w,h){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const add=x=>{const u=typeof x==="string"?enc.encode(x):x;parts.push(u);len+=u.length};
  const obj=(id,fn)=>{offs[id]=len;add(`${id} 0 obj${NL}`);fn();add(`${NL}endobj${NL}`)};
  const n=jpgs.length;
  add(`%PDF-1.4${NL}`);
  obj(1,()=>add("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2,()=>add(`<< /Type /Pages /Count ${n} /Kids [${jpgs.map((_,i)=>(3+3*i)+" 0 R").join(" ")}] >>`));
  jpgs.forEach((j,i)=>{
    const p=3+3*i,cs="q 595 0 0 842 0 0 cm /Im0 Do Q";
    obj(p,()=>add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`));
    obj(p+1,()=>add(`<< /Length ${cs.length} >>${NL}stream${NL}${cs}${NL}endstream`));
    obj(p+2,()=>{add(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.length} >>${NL}stream${NL}`);add(j);add(`${NL}endstream`)});
  });
  const xr=len,total=3*n+3;
  add(`xref${NL}0 ${total}${NL}0000000000 65535 f ${NL}`);
  for(let i=1;i<total;i++)add(String(offs[i]).padStart(10,"0")+` 00000 n ${NL}`);
  add(`trailer${NL}<< /Size ${total} /Root 1 0 R >>${NL}startxref${NL}${xr}${NL}%%EOF`);
  return new Blob(parts,{type:"application/pdf"});
}
async function exportPDF(){
  const items=[];BOOKS.forEach((bk,b)=>{for(let c=1;c<=bk.c;c++){const o=get(b,c);if(o.s||o.m||o.d||o.f)items.push([b,c,o])}});
  if(!items.length){toast("기록된 내용이 없습니다");return}
  toast("PDF 만드는 중…");
  try{await Promise.all([document.fonts.load('700 30px "Noto Serif KR"'),document.fonts.load('500 28px "Noto Sans KR"')])}catch(e){}
  const W=1240,H=1754,M=96,CW=W-2*M,SANS='"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif',SERIF='"Noto Serif KR",Georgia,serif';
  const pages=[];let cv,cx,y;
  const np=()=>{cv=document.createElement("canvas");cv.width=W;cv.height=H;cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,W,H);cx.textBaseline="top";pages.push(cv);y=M};
  const wrap=(t,font)=>{cx.font=font;const out=[];for(const para of String(t).split(NL)){let line="";for(const ch of para){if(cx.measureText(line+ch).width>CW-24&&line){out.push(line);line=ch.trim()===""?"":ch}else line+=ch}out.push(line)}return out};
  np();
  cx.fillStyle="#1d2823";cx.font=`700 46px ${SERIF}`;cx.fillText("성경 한줄정리",M,y);y+=68;
  cx.fillStyle="#66726c";cx.font=`400 26px ${SANS}`;cx.fillText(`${today()} 저장 · 기록된 ${items.length}개 장`,M,y);y+=64;
  let last=-1;
  for(const [b,c,o] of items){
    if(b!==last){
      if(y+120>H-M)np();
      y+=14;cx.fillStyle="#1d2823";cx.font=`700 34px ${SERIF}`;cx.fillText(BOOKS[b].n,M,y);y+=50;
      cx.fillStyle="#c9d0c8";cx.fillRect(M,y,CW,2);y+=18;last=b;
    }
    const sl=o.s?wrap(o.s,`500 28px ${SANS}`):[],ml=o.m?wrap(o.m,`400 25px ${SANS}`):[];
    if(y+50+44>H-M)np();
    const title=`${BOOKS[b].n} ${c}장`;
    cx.font=`700 30px ${SERIF}`;const tw=cx.measureText(title).width;
    if(o.f){cx.fillStyle="#ffe55c";cx.fillRect(M-4,y+17,tw+8,20)}
    cx.fillStyle="#1d2823";cx.font=`700 30px ${SERIF}`;cx.fillText(title,M,y);
    if(o.d){cx.fillStyle="#66726c";cx.font=`400 22px ${SANS}`;cx.fillText(`읽음 ${o.d}`,M+tw+22,y+8)}
    y+=50;
    if(!sl.length&&!ml.length){cx.fillStyle="#8a948e";cx.font=`400 24px ${SANS}`;cx.fillText("작성한 글 없음",M+4,y);y+=38}
    for(const l of sl){if(y+42>H-M)np();cx.fillStyle="#1d2823";cx.font=`500 28px ${SANS}`;cx.fillText(l,M+4,y);y+=42}
    if(sl.length&&ml.length)y+=6;
    for(const l of ml){if(y+40>H-M)np();cx.fillStyle="#555f59";cx.font=`400 25px ${SANS}`;cx.fillText(l,M+4,y);y+=40}
    y+=26;
  }
  const jpgs=pages.map(p=>{const s=atob(p.toDataURL("image/jpeg",0.88).split(",")[1]);return Uint8Array.from(s,ch=>ch.charCodeAt(0))});
  try{
    const blob=buildPDF(jpgs,W,H),fn=`성경한줄정리_${today()}.pdf`;
    if(DL)await DL.save({filename:fn,data:blob});
    else{const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
    toast("PDF를 저장했어요");
  }catch(err){
    if(err&&err.code!=="declined")toast(err.code==="host_unavailable"?"브라우저나 컴퓨터에서 열어 저장해 주세요":"PDF 저장에 실패했어요");
  }
}
/* ===== 인증 ===== */
const amsg=(t,ok)=>{const m=$("amsg");m.textContent=t;m.className="amsg"+(ok?" ok":"")};
const errKo=e=>{const m=(e&&e.message)||"";
  if(/Invalid login/i.test(m))return"이메일 또는 비밀번호가 올바르지 않습니다";
  if(/not confirmed/i.test(m))return"이메일 인증이 필요합니다. 메일함을 확인해 주세요";
  if(/already registered/i.test(m))return"이미 가입된 이메일입니다. 로그인해 주세요";
  if(/rate limit/i.test(m))return"요청이 너무 많습니다. 잠시 후 다시 시도해 주세요";
  return m||"오류가 발생했습니다"};
async function doAuth(mode){
  const email=$("em").value.trim(),password=$("pw").value;
  if(!email||!password){amsg("이메일과 비밀번호를 입력해 주세요");return}
  if(mode==="up"&&password.length<6){amsg("비밀번호는 6자 이상이어야 합니다");return}
  $("btnIn").disabled=$("btnUp").disabled=true;amsg("처리 중…",true);
  try{
    if(mode==="in"){const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;amsg("")}
    else{const {data,error}=await sb.auth.signUp({email,password});if(error)throw error;
      if(data.session)amsg("");else amsg("가입 완료! 이메일로 온 인증 링크를 누른 뒤 로그인해 주세요.",true)}
  }catch(e){amsg(errKo(e))}
  finally{$("btnIn").disabled=$("btnUp").disabled=false}
}
$("aform").addEventListener("submit",e=>{e.preventDefault();doAuth("in")});
$("btnUp").onclick=()=>doAuth("up");
$("logout").onclick=async()=>{await flush();await sb.auth.signOut()};
async function enter(user){
  USER=user;$("uemail").textContent=user.email||"";
  tab="all";cur=null;sel=null;
  await loadAll();
  $("auth").hidden=true;$("app").hidden=false;

}
function leave(){
  USER=null;D={};ROW={};if(chan){sb.removeChannel(chan);chan=null}
  $("app").hidden=true;$("auth").hidden=false;$("pw").value="";closeModal();
}
sb.auth.onAuthStateChange((ev,session)=>{
  setTimeout(()=>{
    if(session&&session.user){if(!USER||USER.id!==session.user.id)enter(session.user)}
    else if(USER)leave();
  },0);
});
